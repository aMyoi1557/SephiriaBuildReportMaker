<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>RABBIT HOUSE</title>

    <!-- jQuery (반드시 먼저 위치) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Select2 CSS 및 JS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #17151d;
            color: white;
            font-family: 'Pretendard', sans-serif;
        }

        .page {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        /* 1. 소개 문구 스타일 */
        .intro-text {
            text-align: center;
            color: #a395a6; /* 기본 회보라색 복구 */
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 마지막 줄 전용 강조 스타일 */
        .intro-text .highlight {
            color: #ff4d4d; /* 빨간색 */
            font-weight: bold; /* 볼드 */
        }

        /* 2. 파일 업로드 래퍼 및 툴팁 스타일 */
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .tooltip-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .help-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #d93838; /* 빨간색 배경 */
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .help-icon:hover {
            background-color: #ff4d4d; /* 마우스 올렸을 때 더 밝은 빨간색 */
        }

        /* 마우스오버 시 표시되는 가이드 이미지 박스 (화면 중앙 고정) */
        .tooltip-image {
            display: none;
            position: fixed;            /* 부모 요소가 아닌 화면(뷰포트) 기준 정렬 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 화면 정확한 중앙 정렬 */
            z-index: 9999;              /* 다른 어떤 요소보다 위에 표시 */
            
            background: #17151d;
            border: 1px solid #756178;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            
            /* 화면을 넘치지 않도록 최대 크기 제한 */
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
        }

        .tooltip-image img {
            max-width: 960px;            /* 이미지 짤림 방지 */
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* 마우스 호버 시 툴팁 이미지 노출 */
        .tooltip-container:hover .tooltip-image {
            display: block;
        }

        /* 입력 영역 */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .input-section {
            background: #292330;
            border: 2px solid #5b4960;
            border-radius: 12px;
            padding: 20px;
        }

        .input-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #5b4960;
            padding-bottom: 12px;
        }

        .input-section h3 {
            margin-top: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        /* Select2 전체 요소 너비 및 폰트 설정 */
        .select2-container {
            width: 100% !important;
        }

        .select2-container,
        .select2-dropdown,
        .select2-container--default .select2-selection--single .select2-selection__rendered,
        .costume-option-item span {
            font-family: 'Pretendard', 'Noto Sans KR', Arial, sans-serif !important;
        }

        /* Select2 기본 상자 (선택창) 크기 및 중앙 정렬 */
        .select2-container--default .select2-selection--single {
            background-color: #17151d;
            border: 1px solid #756178;
            border-radius: 6px;
            height: 64px;               /* 48px 아이콘 + 패딩 여유값 고려한 높이 */
            display: flex;
            align-items: center;        /* 세로 중앙 정렬 */
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: white;
            line-height: normal;
            padding-left: 10px;
            width: 100%;
            display: flex;
            align-items: center;        /* 내부 요소 세로 중앙 정렬 */
        }

        /* 오른쪽 화살표 위치 및 크기 조정 */
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 64px;
            top: 0;
            right: 10px;
        }

        /* 드롭다운 펼쳐진 박스 배경 스타일 */
        .select2-dropdown {
            background-color: #17151d;
            border: 1px solid #756178;
            color: white;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #5b4960;
        }

        .select2-container--default .select2-results__option[aria-selected=true] {
            background-color: #292330;
        }

        /* 선택지 내부 아이콘 + 텍스트 정렬 */
        .costume-option-item {
            display: flex;
            align-items: center;        /* 아이콘과 텍스트 세로 중앙 정렬 */
            gap: 16px;                  /* 아이콘과 텍스트 사이 간격 */
        }

        /* 48x48px 아이콘 크기 지정 */
        .costume-option-item img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;             /* 이미지 비율 유지 및 축소 방지 */
        }

        /* 텍스트 크기 지정 */
        .costume-option-item span {
            font-size: 21px;
            line-height: 1;
        }

        .upload-box {
            padding: 15px;
            background: #211d27;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .upload-box input {
            width: 100%;
        }

        /* 제목과 입력 상자를 한 줄에 정렬 */
        .title-with-input {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        /* 감싸는 요소 안의 h3 여백 제거 */
        .title-with-input h3 {
            margin: 0;
        }

        /* 재능/콤보 통합 상자 스타일 */
        .radio-container-box {
            background: #211d27;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 한 줄에 분류명 + 선택 단추 배치 */
        .radio-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            border-bottom: 1px dashed #3a3242;
        }

        .radio-row:last-child {
            border-bottom: none;
        }

        /* 분류명 영역 (아이콘 + 텍스트 정렬) */
        .radio-row-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            min-width: 90px;
            font-size: 14px;
            color: #e2d3e5;
        }

        /* 선택지 모음: 분류명 바로 오른쪽부터 동일한 간격으로 왼쪽 정렬 */
        .radio-items {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 16px;       /* 모든 선택지 사이의 동일한 고정 간격 */
            margin-left: 0;  /* 오른쪽 정렬 해제 (분류명과의 간격은 radio-row의 gap: 12px 적용) */
        }

        /* 글자 크기에 맞게 자동 조절되는 아이콘 스타일 */
        .combo-icon {
            height: 2em;
            width: auto;
            object-fit: contain;
            vertical-align: middle;
        }

        /* 선택지 사이사이 얇은 밝은색 세로 구분선 */
        .radio-items .check-item:not(:first-child)::before {
            content: "";
            position: absolute;
            left: -7px;          /* gap(16px)의 정확한 중앙에 위치 */
            top: 50%;
            transform: translateY(-50%);
            width: 3px;           /* 세로선 두께 */
            height: 20px;         /* 세로선 높이 */
            background: #dba6cb;  /* 얇고 밝은 보라/회색선 (필요시 #756178 등으로 변경 가능) */
        }

        /* 스탯 전용 업로드 박스: 한 줄 정렬 */
        .stats-upload-box {
            padding: 12px 15px;
            background: #211d27;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 소분류 제목과 버튼을 양 끝 배치 */
            gap: 12px;
        }

        /* 소분류 제목 여백 정리 */
        .stats-upload-box label {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap; /* 줄바꿈 방지 */
        }

        /* 파일 입력 버튼 너비 자동 조절 */
        .stats-upload-box input[type="file"] {
            width: auto;
        }

        /* 버튼 기본 스타일 */
        button {
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #makeButton {
            display: block;
            margin: 30px auto 15px;
            background: #76556d;
            color: white;
            font-size: 20px;
            padding: 16px 50px;
        }

        #downloadButton {
            display: block;
            margin: 15px auto 30px;
            background: #456875;
            color: white;
        }

        button:hover {
            filter: brightness(1.15);
        }

        #resultCanvas {
            display: block !important;
            margin: 30px auto !important; /* 화면 가로 중앙 정렬 고정 */
            
            width: auto !important;       /* 원본 가로 크기 유지 */
            height: auto !important;      /* 원본 세로 크기 유지 */
            max-width: none !important;   /* 화면이나 부모 박스에 의한 축소 방지 */
            
            border: 2px solid #5b4960;
            border-radius: 12px;
        }

        @media (max-width: 900px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <h1>RABBIT HOUSE</h1>
    <p class="intro-text">
        SEPHIRIA 빌드 리포트 생성기입니다.<br>
        데이터를 입력하면 갈무리하여 이미지로 만들어 드립니다 :)<br>
        <span class="highlight">!!! 이미지를 준비하시기 전 꼭 가이드를 봐주세요 !!!</span>
    </p>

    <!-- 입력 영역 -->
    <div class="input-grid">

        <!-- ① START -->
        <section class="input-section">
            <h2>① 출발 데이터</h2>

            <!-- 코스튬 -->
            <div class="field">
                <label>코스튬</label>
                <select id="costumeSelect"></select>
            </div>

            <!-- 재능 -->
            <h3>재능</h3>
            <div id="talentContainer"></div>

            <!-- 뿌리거둠 -->
            <h3>
                뿌리거둠
            </h3>
            <div class="upload-box">
                <div class="file-upload-wrapper">
                    <input type="file" id="rootInput" accept="image/*">
                    
                    <!-- 물음표 아이콘 & 가이드 이미지 툴팁 -->
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/roots_guide.png" alt="뿌리거둠 가이드">
                        </div>
                    </div>
                </div>
        </section>

        <!-- ② IN GAME -->
        <section class="input-section">
            <h2>② 인게임 데이터</h2>

            <!-- 인벤토리 -->
            <h3>
                인벤토리
            </h3>
            <div class="upload-box">
                <div class="file-upload-wrapper">
                    <input type="file" id="inventoryInput" accept="image/*">
                    
                    <!-- 물음표 아이콘 & 가이드 이미지 툴팁 -->
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/inventory_guide.png" alt="인벤토리 가이드">
                        </div>
                    </div>
                </div>
            </div>
            <h3>
                콤보 추가 (선택)
            </h3>
            <div class="upload-box">
                <div class="file-upload-wrapper">
                    <input type="file" id="comboInput" accept="image/*">
                    
                    <!-- 물음표 아이콘 & 가이드 이미지 툴팁 -->
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/combo_guide.png" alt="콤보 가이드">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ③ RESULT -->
        <section class="input-section">
            <h2>③ 결과 데이터</h2>

            <!-- 스탯 -->
            <h3>
                능력치
            </h3>
            <!-- 예시: 능력치 업로드 영역 -->
            <div class="stats-upload-box">
                <label>공통 능력치 : </label>
                <div class="file-upload-wrapper">
                    <input type="file" id="statsInput1" accept="image/*">
                    
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/stats1_guide.png" alt="공통 능력치 가이드">
                        </div>
                    </div>
                </div>
            </div>

            <div class="stats-upload-box">
                <label>전문 능력치 : </label>
                <div class="file-upload-wrapper">
                    <input type="file" id="statsInput2" accept="image/*">
                    
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/stats2_guide.png" alt="공통 능력치 가이드">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 피해량 -->
            <h3>피해량 통계 (상위 12목록까지 표시됩니다)</h3>
            <!-- 예시: 인벤토리 업로드 영역 -->
            <div class="upload-box">
                <div class="file-upload-wrapper">
                    <input type="file" id="damageInput" accept="image/*">
                    
                    <!-- 물음표 아이콘 & 가이드 이미지 툴팁 -->
                    <div class="tooltip-container">
                        <span class="help-icon">?</span>
                        <div class="tooltip-image">
                            <img src="assets/guide/damage_guide.png" alt="인벤토리 가이드">
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- 버튼 -->
    <button id="makeButton">결과 이미지 만들기</button>
    <button id="downloadButton">결과 이미지 저장</button>

    

</div>

<!-- 결과 이미지 출력 캔버스 -->
<canvas id="resultCanvas" style="display: none;"></canvas>

========================================================= */

function createSelect(element, data) {
    element.innerHTML = "";
    data.forEach((item, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = item.name;
        element.appendChild(option);
    });
}

function createRadioGroups(container, data, prefix) {
    container.innerHTML = "";

    // 전체 항목을 담을 하나의 상자 생성
    const mainBox = document.createElement("div");
    mainBox.className = "radio-container-box";

    data.forEach((group, groupIndex) => {
        // 한 줄을 나타내는 행 생성
        const rowDiv = document.createElement("div");
        rowDiv.className = "radio-row";

        // 분류명 (좌측)
        const title = document.createElement("div");
        title.className = "radio-row-title";

        // [추가] 콤보일 경우 순서대로 assets/icon1.png ~ icon20.png 아이콘 생성
        if (prefix === "combo") {
            const iconImg = document.createElement("img");
            iconImg.src = `assets/icons/icon${groupIndex + 1}.png`;
            iconImg.className = "combo-icon";
            iconImg.alt = group.name;
            title.appendChild(iconImg);
        }

        const titleText = document.createElement("span");
        titleText.textContent = group.name;
        title.appendChild(titleText);

        rowDiv.appendChild(title);

        // 선택 단추 모음 (우측)
        const itemsDiv = document.createElement("div");
        itemsDiv.className = "radio-items";

        group.levels.forEach((level, levelIndex) => {
            const label = document.createElement("label");
            label.className = "check-item";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `${prefix}_group_${groupIndex}`;
            radio.value = levelIndex;
            
            radio.dataset.tier = (level.tier !== undefined) ? level.tier : levelIndex;

            if (levelIndex === 0) {
                radio.checked = true;
            }

            const text = document.createElement("span");
            text.textContent = level.name;

            label.appendChild(radio);
            label.appendChild(text);
            itemsDiv.appendChild(label);
        });

        rowDiv.appendChild(itemsDiv);
        mainBox.appendChild(rowDiv);
    });

    container.appendChild(mainBox);
}

const canvas = document.getElementById("resultCanvas");
const ctx = canvas.getContext("2d");

// 이미지 로드 헬퍼 함수 (비동기 처리)
function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Failed to load: ${src}`));
        img.src = src;
    });
}

// 픽셀 색 확인
function colorCheck(src, color) {
    for (let i=0;i<3;i++) {
        if (Math.abs(src[i]-color[i])>5) {
            return false;
        }
    }
    return true;
}

function zeroCheck(imgData) {
    const d = imgData.data;

    for (let i = 0; i < d.length; i += 4) {
        const diffR = d[i];
        const diffG = d[i + 1];
        const diffB = d[i + 2];
        if ([diffR,diffG,diffB]==[128,128,128]) {
            return true;
        }
    }
    return false;
}

// 두 Canvas Data 간의 오차율(MSE)을 계산하는 함수
function calculateMSE(imgData1, imgData2) {
    const d1 = imgData1.data;
    const d2 = imgData2.data;
    let sumSquaredError = 0;

    for (let i = 0; i < d1.length; i += 4) {
        const diffR = d1[i] - d2[i];
        const diffG = d1[i + 1] - d2[i + 1];
        const diffB = d1[i + 2] - d2[i + 2];
        sumSquaredError += (diffR * diffR + diffG * diffG + diffB * diffB);
    }
    return sumSquaredError / (d1.length / 4);
}

        /* ----------------------------------------------------
